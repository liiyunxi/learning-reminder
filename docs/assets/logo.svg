<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- 学习计划 · 像素 Logo（16×16 网格，逐格拼合，无渐变无圆角） -->
  <!-- 靛蓝底 -->
  <rect x="0" y="0" width="16" height="16" fill="#4F46E5"/>
  <!-- 左页：摊开的书（白） -->
  <rect x="2" y="3" width="5" height="7" fill="#FFFFFF"/>
  <rect x="3" y="10" width="4" height="1" fill="#FFFFFF"/>
  <!-- 右页：摊开的书（浅靛蓝） -->
  <rect x="9" y="3" width="5" height="7" fill="#C7D2FE"/>
  <rect x="9" y="10" width="4" height="1" fill="#C7D2FE"/>
  <!-- 绿色底座线 -->
  <rect x="1" y="12" width="14" height="1" fill="#10B981"/>
</svg>